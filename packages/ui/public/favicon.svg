<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ADHD">
  <title>ADHD</title>
  <desc>ADHD wordmark - placeholder icon until brand identity is defined</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="8"/>

  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="'Nunito','Segoe UI',system-ui,Arial,sans-serif"
        font-weight="800" font-size="176" letter-spacing="-10" fill="#FFFFFF">ADHD</text>
</svg>
